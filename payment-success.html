<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="MORVEN payment status.">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="cart.css">
</head>
<body class="payment-page">
  <main class="payment-result" aria-live="polite">
    <p class="kicker blue">MORVEN / Payment</p>
    <h1 id="payment-title">Confirming your payment.</h1>
    <p id="payment-message">We are checking your Paystack transaction.</p>
    <a class="payment-back" href="dashboard.html">Return to collection <span>↗</span></a>
  </main>
  <script>
    const apiUrl = window.MORVEN_API_URL || (window.location.hostname === 'localhost' ? 'http://localhost:4000' : window.location.origin);
    const reference = new URLSearchParams(window.location.search).get('reference');
    const title = document.querySelector('#payment-title');
    const message = document.querySelector('#payment-message');
    if (!reference) {
      title.textContent = 'Payment reference missing.';
      message.textContent = 'Return to the collection and try checkout again.';
    } else {
      fetch(`${apiUrl}/api/payments/paystack/verify/${encodeURIComponent(reference)}`)
        .then(async (response) => {
          const data = await response.json();
          if (!response.ok) throw new Error(data.message || 'Unable to verify payment.');
          if (data.status !== 'success') throw new Error(`Payment status: ${data.status}.`);
          title.textContent = 'Payment confirmed.';
          message.textContent = `Reference ${data.reference}. Thank you for choosing MORVEN.`;
          localStorage.removeItem('morvenCart');
        })
        .catch((error) => {
          title.textContent = 'Payment needs attention.';
          message.textContent = error.message;
        });
    }
  </script>
</body>
</html>
