<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="MORVEN administration.">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body class="admin-page">
  <header class="site-header">
    <a class="logo" href="index.html"><img src="Images/MORVEN.png" alt="MORVEN"></a>
    <button class="admin-exit admin-back" type="button">Back ↙</button>
  </header>
  <main class="admin-shell">
    <div class="admin-heading"><div><p class="kicker blue">MORVEN / Control room</p><h1>Manage<br><em>the archive.</em></h1></div><button class="admin-signout" type="button">Sign out</button></div>
    <p class="admin-status" role="status" aria-live="polite">Checking administrator access...</p>
    <p class="admin-toast" role="status" aria-live="polite" hidden></p>
    <section class="admin-grid" hidden>
      <form class="admin-card product-form" enctype="multipart/form-data">
        <p class="kicker blue">Package management</p><h2>Add a piece</h2>
        <label>Product name<input name="name" required placeholder="Studio Overshirt"></label>
        <label>Price in GH₵<input name="price" type="number" min="1" step="1" required placeholder="148"></label>
        <label>Product picture<input name="image" type="file" accept="image/jpeg,image/png" required></label>
        <label>Description<textarea name="description" rows="3" placeholder="Heavy cotton / Ink"></textarea></label>
        <button class="admin-action" type="submit">Publish item <span>↗</span></button>
        <button class="admin-cancel" type="button" hidden>Cancel edit</button>
      </form>
      <section class="admin-card"><p class="kicker blue">Live catalog</p><h2>Packages</h2><div class="admin-table-wrap"><table><thead><tr><th>Item</th><th>Price</th><th></th></tr></thead><tbody class="products-table"></tbody></table></div></section>
      <section class="admin-card admin-wide"><p class="kicker blue">Customers</p><h2>Users</h2><div class="admin-table-wrap"><table><thead><tr><th>Name</th><th>Email</th><th>Phone</th></tr></thead><tbody class="users-table"></tbody></table></div></section>
      <section class="admin-card admin-wide"><p class="kicker blue">Fulfillment</p><h2>Orders</h2><div class="admin-table-wrap"><table><thead><tr><th>Order ID</th><th>Customer</th><th>Amount</th><th>Delivery details</th><th>Status</th><th>Update</th></tr></thead><tbody class="orders-table"></tbody></table></div></section>
    </section>
  </main>
  <script type="module" src="admin.js"></script>
</body>
</html>
